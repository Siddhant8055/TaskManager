<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Task Manager</a>
        <div class="d-flex" id="authArea">
          <button class="btn btn-outline-primary me-2" id="showLoginBtn">Login</button>
          <button class="btn btn-primary" id="showRegisterBtn">Register</button>
        </div>
        <div class="d-none" id="userArea">
          <span class="me-2" id="usernameDisplay"></span>
          <button class="btn btn-sm btn-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div id="authForms">
        <!-- Login Form -->
        <div id="loginForm" class="card p-3 mb-3 d-none">
          <h5>Login</h5>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="loginUsername" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="loginPassword" type="password" class="form-control">
          </div>
          <button class="btn btn-primary" id="loginBtn">Login</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="card p-3 mb-3 d-none">
          <h5>Register</h5>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="regUsername" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="regEmail" type="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="regPassword" type="password" class="form-control">
          </div>
          <button class="btn btn-primary" id="registerBtn">Register</button>
        </div>
      </div>

      <div id="appArea" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Your Tasks</h3>
          <div>
            <button class="btn btn-success" id="showTaskFormBtn">New Task</button>
          </div>
        </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <input id="searchInput" class="form-control" placeholder="Search tasks...">
            </div>
            <div class="col-md-3">
              <select id="filterStatus" class="form-select">
                <option value="">All statuses</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
              </select>
            </div>
            <div class="col-md-3">
              <select id="filterPriority" class="form-select">
                <option value="">All priorities</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
          </div>

          <div id="alertArea"></div>

        <div id="tasksList" class="row gy-3">
          <!-- tasks will be rendered here -->
        </div>
      </div>
    </div>

    <!-- Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="taskModalTitle">Create Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input id="taskTitle" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="taskDescription" class="form-control"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Priority</label>
              <select id="taskPriority" class="form-select">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select id="taskStatus" class="form-select">
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveTaskBtn">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
