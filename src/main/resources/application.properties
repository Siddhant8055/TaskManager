### Active profile (defaults to 'dev' for local development using H2).
# To run with MySQL set the env var SPRING_PROFILES_ACTIVE=prod or pass -Dspring.profiles.active=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

### Database (MySQL) configuration - used when running with 'prod' profile
# Configure these via environment variables in production; do NOT commit secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/task_manager_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:task_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:task_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### JPA / Hibernate
# ddl-auto: validate | update | create | create-drop
# - update: automatically updates the schema (useful for development)
# - validate: only validate the schema matches entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

### JWT (placeholders, will explain later)
jwt.secret=ReplaceWithAStrongSecretKeyChangeMe
jwt.expirationMs=3600000

### Server
server.port=8080

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

